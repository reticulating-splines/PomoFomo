<svg class="dragon" viewBox="0 0 180 180"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!--
    PomoFomo Dragon — "Ember"
    Chibi proportions: merged head+body silhouette, big glossy eyes, small
    bat-style wings, curled spade tail. Named groups let CSS animate parts
    independently; dragon__root wraps everything for body-level moves.
  -->

  <g class="dragon__root">

    <!-- Ground shadow -->
    <ellipse cx="90" cy="158" rx="40" ry="6" fill="rgba(0,0,0,0.08)"/>

    <!-- ── Tail (behind body) ─────────────────────────────────────────────── -->
    <g class="dragon__tail">
      <path d="M 126 126 C 148 118 164 126 161 140 C 158 150 144 151 137 142 C 132 136 128 130 126 126"
            fill="#4E8FC4"/>
      <!-- Spade tip -->
      <path d="M 157 132 C 165 124 174 126 172 134 C 171 141 163 144 157 140 C 155 138 155 134 157 132"
            fill="#3D7AAF"/>
    </g>

    <!-- ── Wings (behind body, clearly bat-style) ─────────────────────────── -->
    <g class="dragon__wings">
      <path class="dragon__wing-left"
            d="M 56 96
               C 36 92 20 76 22 54
               C 23 44 33 42 39 50
               C 40 38 52 36 56 46
               C 63 38 72 42 71 52
               C 70 72 64 88 56 96 Z"
            fill="#4E8FC4" opacity="0.92"/>
      <path d="M 56 96 C 44 80 36 64 34 52 M 56 96 C 52 78 50 62 51 50"
            fill="none" stroke="#3D7AAF" stroke-width="1.3" opacity="0.45"/>

      <path class="dragon__wing-right"
            d="M 124 96
               C 144 92 160 76 158 54
               C 157 44 147 42 141 50
               C 140 38 128 36 124 46
               C 117 38 108 42 109 52
               C 110 72 116 88 124 96 Z"
            fill="#4E8FC4" opacity="0.92"/>
      <path d="M 124 96 C 136 80 144 64 146 52 M 124 96 C 128 78 130 62 129 50"
            fill="none" stroke="#3D7AAF" stroke-width="1.3" opacity="0.45"/>
    </g>

    <!-- ── Body + head (same fill: seam disappears) ───────────────────────── -->
    <ellipse class="dragon__body" cx="90" cy="116" rx="44" ry="40" fill="#62A8DC"/>
    <ellipse class="dragon__head-shape" cx="90" cy="64" rx="37" ry="34" fill="#62A8DC"/>
    <!-- Soft head highlight -->
    <ellipse cx="75" cy="46" rx="13" ry="8" fill="white" opacity="0.14"/>

    <!-- ── Feet ───────────────────────────────────────────────────────────── -->
    <g class="dragon__limbs">
      <ellipse cx="64" cy="151" rx="13" ry="8.5" fill="#4E8FC4"/>
      <line x1="58" y1="155" x2="58" y2="158" stroke="#3D7AAF" stroke-width="2" stroke-linecap="round"/>
      <line x1="64" y1="156" x2="64" y2="159" stroke="#3D7AAF" stroke-width="2" stroke-linecap="round"/>
      <line x1="70" y1="155" x2="70" y2="158" stroke="#3D7AAF" stroke-width="2" stroke-linecap="round"/>

      <ellipse cx="116" cy="151" rx="13" ry="8.5" fill="#4E8FC4"/>
      <line x1="110" y1="155" x2="110" y2="158" stroke="#3D7AAF" stroke-width="2" stroke-linecap="round"/>
      <line x1="116" y1="156" x2="116" y2="159" stroke="#3D7AAF" stroke-width="2" stroke-linecap="round"/>
      <line x1="122" y1="155" x2="122" y2="158" stroke="#3D7AAF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- ── Belly ──────────────────────────────────────────────────────────── -->
    <ellipse class="dragon__belly" cx="90" cy="122" rx="27" ry="24" fill="#FBD99A"/>
    <path d="M 72 110 Q 90 104 108 110" fill="none" stroke="#EFC077" stroke-width="1.5" opacity="0.6"/>
    <path d="M 70 120 Q 90 114 110 120" fill="none" stroke="#EFC077" stroke-width="1.5" opacity="0.5"/>
    <path d="M 71 130 Q 90 124 109 130" fill="none" stroke="#EFC077" stroke-width="1.5" opacity="0.4"/>

    <!-- ── Arms (little nubs resting at belly sides) ──────────────────────── -->
    <ellipse cx="56" cy="116" rx="8" ry="13" fill="#4E8FC4" transform="rotate(-18 56 116)"/>
    <ellipse cx="124" cy="116" rx="8" ry="13" fill="#4E8FC4" transform="rotate(18 124 116)"/>

    <!-- ── Horns ──────────────────────────────────────────────────────────── -->
    <path d="M 67 36 C 63 24 70 16 76 24 C 79 28 77 34 74 39 Z" fill="#F6E7C9"/>
    <path d="M 113 36 C 117 24 110 16 104 24 C 101 28 103 34 106 39 Z" fill="#F6E7C9"/>

    <!-- ── Face ───────────────────────────────────────────────────────────── -->
    <g class="dragon__head">
      <!-- Muzzle -->
      <ellipse cx="90" cy="82" rx="16" ry="11" fill="#8CC4EA"/>
      <ellipse cx="84.5" cy="80" rx="2.3" ry="1.7" fill="#3D7AAF"/>
      <ellipse cx="95.5" cy="80" rx="2.3" ry="1.7" fill="#3D7AAF"/>

      <!-- Smile -->
      <path class="dragon__mouth"
            d="M 82 88 Q 90 95 98 88"
            fill="none" stroke="#3D6FA3" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Eyes -->
      <g class="dragon__eyes">
        <circle cx="72" cy="61" r="12" fill="white"/>
        <circle class="dragon__pupil-left" cx="74" cy="62" r="7" fill="#23233A"/>
        <circle cx="77" cy="58" r="2.6" fill="white"/>
        <circle cx="72" cy="65" r="1.2" fill="white" opacity="0.8"/>

        <circle cx="108" cy="61" r="12" fill="white"/>
        <circle class="dragon__pupil-right" cx="106" cy="62" r="7" fill="#23233A"/>
        <circle cx="109" cy="58" r="2.6" fill="white"/>
        <circle cx="104" cy="65" r="1.2" fill="white" opacity="0.8"/>

        <!-- Eyelids: scaleY(0) at rest, scaleY(1) closes (CSS drives) -->
        <circle class="dragon__eyelid-left"  cx="72"  cy="61" r="12.5" fill="#62A8DC"/>
        <circle class="dragon__eyelid-right" cx="108" cy="61" r="12.5" fill="#62A8DC"/>
      </g>

      <!-- Blush -->
      <ellipse cx="59" cy="74" rx="7" ry="4.5" fill="#FF9FB0" opacity="0.35"/>
      <ellipse cx="121" cy="74" rx="7" ry="4.5" fill="#FF9FB0" opacity="0.35"/>
    </g>

    <!-- ── Book accessory (focus states) — held against the belly ─────────── -->
    <g class="dragon__accessory dragon__accessory--book" transform="rotate(-3 90 134)">
      <rect x="72"  y="124" width="17" height="21" rx="2" fill="#FFF5E8"/>
      <rect x="91"  y="124" width="17" height="21" rx="2" fill="#FFF0DC"/>
      <rect x="88"  y="124" width="4"  height="21" rx="1" fill="#C5622E"/>
      <rect x="71"  y="123" width="19" height="23" rx="2" fill="none" stroke="#E87C45" stroke-width="1.5"/>
      <rect x="90"  y="123" width="19" height="23" rx="2" fill="none" stroke="#E87C45" stroke-width="1.5"/>
      <line x1="75" y1="130" x2="85" y2="130" stroke="#C5A882" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      <line x1="75" y1="134" x2="85" y2="134" stroke="#C5A882" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      <line x1="75" y1="138" x2="83" y2="138" stroke="#C5A882" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      <line x1="95" y1="130" x2="105" y2="130" stroke="#C5A882" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      <line x1="95" y1="134" x2="105" y2="134" stroke="#C5A882" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      <line x1="95" y1="138" x2="103" y2="138" stroke="#C5A882" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- ── Butterfly accessory (break-active) ─────────────────────────────── -->
    <g class="dragon__accessory dragon__accessory--butterfly">
      <path d="M 140 44 C 145 34 157 35 155 44 C 153 51 145 50 140 44" fill="#FF9BE8" opacity="0.92"/>
      <path d="M 140 44 C 135 34 123 35 125 44 C 127 51 135 50 140 44" fill="#C876D4" opacity="0.92"/>
      <path d="M 140 45 C 147 52 148 60 143 60 C 139 60 138 53 140 45" fill="#C876D4" opacity="0.75"/>
      <path d="M 140 45 C 133 52 132 60 137 60 C 141 60 142 53 140 45" fill="#FF9BE8" opacity="0.75"/>
      <ellipse cx="140" cy="48" rx="2" ry="7" fill="#6B3A6B"/>
      <line x1="140" y1="41" x2="135" y2="34" stroke="#6B3A6B" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="140" y1="41" x2="145" y2="34" stroke="#6B3A6B" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="135" cy="33" r="2" fill="#FF9BE8"/>
      <circle cx="145" cy="33" r="2" fill="#FF9BE8"/>
    </g>

    <!-- ── Sparkles (break-start celebration burst) ───────────────────────── -->
    <g class="dragon__sparkles">
      <path d="M 42 46 l 4 -12 4 12 -8 0 Z" fill="#FFD93D"/>
      <path d="M 140 34 l 3 -10 3 10 -6 0 Z" fill="#FFD93D"/>
      <circle cx="26"  cy="78" r="4.5" fill="#FFD93D"/>
      <circle cx="156" cy="66" r="4"   fill="#FF9BE8"/>
      <circle cx="50"  cy="26" r="3"   fill="#FF9BE8"/>
      <circle cx="130" cy="22" r="3"   fill="#FFD93D"/>
      <circle cx="164" cy="46" r="2.5" fill="#FF9BE8"/>
      <path d="M 22 104 l 3 -8 3 8 -6 0 Z"  fill="#FF9BE8"/>
      <path d="M 158 98 l 3 -8 3 8 -6 0 Z"  fill="#FFD93D"/>
    </g>

    <!-- ── ZZZ (focus-sleeping) ───────────────────────────────────────────── -->
    <g class="dragon__zzz">
      <g class="zzz-small">
        <text x="122" y="68" font-size="9" fill="#9AA8D8" font-weight="bold"
              font-family="sans-serif" text-anchor="middle">z</text>
      </g>
      <g class="zzz-medium">
        <text x="130" y="52" font-size="12" fill="#7A88BC" font-weight="bold"
              font-family="sans-serif" text-anchor="middle">z</text>
      </g>
      <g class="zzz-large">
        <text x="138" y="36" font-size="15" fill="#5F6FA6" font-weight="bold"
              font-family="sans-serif" text-anchor="middle">Z</text>
      </g>
    </g>

  </g><!-- /.dragon__root -->
</svg>
