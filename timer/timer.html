<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PomoFomo</title>
  <link rel="stylesheet" href="timer.css">
  <!-- Favicon is redrawn every tick by favicon.js -->
  <link id="favicon" rel="icon" type="image/png" href="../assets/icons/icon32.png">
</head>

<!-- data-status drives all CSS theming; data-paused adds the paused treatment -->
<body data-status="idle" data-paused="false">

  <div class="app-shell">

    <!-- Session indicator: ●●○ dots + label -->
    <div class="session-track">
      <div class="session-dots" id="sessionDots" role="img" aria-label="Session progress"></div>
      <span class="session-label" id="sessionLabel">Session 1</span>
    </div>

    <!-- Central stage: progress ring + character -->
    <div class="timer-stage" aria-hidden="true">
      <svg class="progress-ring" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring-track" cx="110" cy="110" r="96"
                fill="none" stroke-width="8" />
        <!-- stroke-dashoffset animated by timer.js -->
        <circle class="ring-arc" id="progressArc" cx="110" cy="110" r="96"
                fill="none" stroke-width="8" stroke-linecap="round"
                transform="rotate(-90 110 110)" />
      </svg>

      <!-- Dragon or book SVG injected here by character.js -->
      <div class="character-container" id="characterContainer"></div>
    </div>

    <!-- Time remaining.
         aria-live is intentionally NOT here (it changes every second) —
         screen reader announcements happen on statusLabel only. -->
    <div class="time-display" id="timeDisplay">20:00</div>

    <p class="status-label" id="statusLabel" aria-live="polite" aria-atomic="true">
      Ready to focus?
    </p>

    <div class="controls">
      <!-- Start: shown while idle. Also unlocks the AudioContext (user gesture). -->
      <button class="btn btn-primary" id="btnStart">Start</button>

      <!-- Snooze: shown during focus-warning, once per session -->
      <button class="btn btn-snooze" id="btnSnooze" hidden
              aria-label="Snooze for 5 more minutes">
        5 more minutes?
      </button>

      <!-- Deliberately low-key stop — an escape hatch, not a temptation -->
      <button class="btn-stop-link" id="btnStopLink" hidden>stop the timer</button>
    </div>

  </div>

  <!-- Break banner — pinned to the top during breaks -->
  <div class="break-banner" id="breakBanner" hidden>
    <div class="break-banner__inner">
      <h1 class="break-banner__title" id="breakBannerTitle">Break time!</h1>
      <p class="break-banner__subtitle" id="breakBannerSubtitle"></p>
    </div>
  </div>

  <script type="module" src="timer.js"></script>
</body>
</html>
