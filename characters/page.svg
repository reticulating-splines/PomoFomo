<svg class="char page" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!--
    PomoFomo — "Page" the book.
    A chunky upright hardcover with a face on its front cover. The cover
    hinges at the spine (x≈55) so it can flap open like a wing; the face is a
    sibling layer so it never squashes. State classes (page--idle, …) on this
    root are styled in characters/page.css.
  -->
  <ellipse class="page__shadow" cx="100" cy="180" rx="50" ry="6" fill="rgba(42,35,66,0.10)"/>

  <g class="page__root">
    <g class="page__inner">

      <!-- Feet + arms sit behind the book so they emerge from it -->
      <g class="page__feet" fill="#B8325F">
        <ellipse cx="79" cy="171.5" rx="12.5" ry="7.5"/>
        <ellipse cx="121" cy="171.5" rx="12.5" ry="7.5"/>
        <ellipse cx="76" cy="174" rx="6" ry="2.6" fill="#D9487A" opacity=".35"/>
        <ellipse cx="118" cy="174" rx="6" ry="2.6" fill="#D9487A" opacity=".35"/>
      </g>
      <g class="page__arm-l">
        <path d="M49 114 L29 137" stroke="#B8325F" stroke-width="11" stroke-linecap="round"/>
        <circle cx="28" cy="138.5" r="6.8" fill="#B8325F"/>
      </g>
      <g class="page__arm-r">
        <path d="M151 114 L171 137" stroke="#B8325F" stroke-width="11" stroke-linecap="round"/>
        <circle cx="172" cy="138.5" r="6.8" fill="#B8325F"/>
      </g>

      <!-- Back cover + page block (pages show on the right, and inside when the cover opens) -->
      <g class="page__body">
        <rect x="50" y="33" width="106" height="136" rx="9" fill="#B8325F"/>
        <rect x="56" y="37" width="96" height="128" rx="4" fill="#FFF6E3"/>
        <g stroke="#EADBC0" stroke-linecap="round">
          <path stroke-width="2.4" d="M66 56 H128 M66 65 H134 M66 74 H120 M66 83 H132 M66 92 H126 M66 101 H134 M66 110 H112 M66 128 H130 M66 137 H134 M66 146 H118"/>
          <path stroke-width="1" d="M145 44 H151 M145 50 H151 M145 56 H151 M145 62 H151 M145 68 H151 M145 74 H151 M145 80 H151 M145 86 H151 M145 92 H151 M145 98 H151 M145 104 H151 M145 110 H151 M145 116 H151 M145 122 H151 M145 128 H151 M145 134 H151 M145 140 H151 M145 146 H151 M145 152 H151 M145 158 H151"/>
        </g>
      </g>

      <!-- Ribbon bookmark: tucked between the pages, pokes out the top like a tuft -->
      <g class="page__ribbon">
        <path d="M112 38 C112 26 115 18 119 8 L122.5 13.5 L127.5 9.5 C124 19 120.5 27 120.5 38 Z" fill="#2FB5A5"/>
        <path d="M117 38 C117 27 120 19 124 11.2 L127.5 9.5 C124 19 120.5 27 120.5 38 Z" fill="#1E7F78" opacity=".28"/>
        <path d="M114.4 34 C114.4 26 116.2 19.5 118.8 13" fill="none" stroke="#8EE0D4" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
      </g>

      <!-- Front cover: hinges at the spine -->
      <g class="page__cover">
        <path d="M54 30 H132 A12 12 0 0 1 144 42 V158 A12 12 0 0 1 132 170 H54 Z" fill="#D9487A"/>
        <!-- watercolour: colour variation + blooms (static) -->
        <path d="M60 126 C66 118 82 120 89 131 C94 141 85 153 72 153 C62 152 56 139 60 126 Z" fill="#E45E7E" opacity=".38"/>
        <path d="M106 138 C117 132 131 136 133 147 C134 156 123 162 112 159 C103 156 100 145 106 138 Z" fill="#C43B6C" opacity=".3"/>
        <path d="M63 54 C70 46 93 44 106 49 C115 53 112 61 101 63 C88 65 73 67 66 63 C61 60 60 57 63 54 Z" fill="#EE6B97" opacity=".38"/>
        <path d="M128 30 H132 A12 12 0 0 1 144 42 V158 A12 12 0 0 1 132 170 H54 V163 H130 A7 7 0 0 0 137 156 V40 A10 10 0 0 0 128 30 Z" fill="#B8325F" opacity=".75"/>
        <path d="M58 163.6 H130 A7 7 0 0 0 137 156 V40 A10 10 0 0 0 129 30.6" fill="none" stroke="#9C2452" stroke-width="1.4" stroke-linecap="round" opacity=".32"/>
        <path d="M63 40.6 C70 36.6 98 36 112 38.4 C116.5 39.4 115.5 43.6 110 44 C96 45.6 74 45.6 65 44.6 C60.6 44 60 42 63 40.6 Z" fill="#F28AAE" opacity=".8"/>
        <circle cx="121.5" cy="40.8" r="3.4" fill="#F28AAE" opacity=".8"/>
        <path d="M124 30 H132 A12 12 0 0 1 144 42 V50 Z" fill="#FFC93C"/>
        <path d="M131 32 A10 10 0 0 1 141.5 41 L141.5 44" fill="none" stroke="#FFE08A" stroke-width="2" stroke-linecap="round" opacity=".8"/>
        <path d="M144 150 V158 A12 12 0 0 1 132 170 H124 Z" fill="#E9AE1C"/>
        <path d="M143.6 152 L126.5 169.5" stroke="#C98F0E" stroke-width="1.2" opacity=".35"/>
      </g>

      <!-- Spine (stays put while the cover flaps) -->
      <g class="page__spine">
        <path d="M52 30 H57 V170 H52 A12 12 0 0 1 40 158 V42 A12 12 0 0 1 52 30 Z" fill="#B8325F"/>
        <path d="M44 60 C46 57.5 50 57.5 52 60 V138 C50 141 46 141 44 138 Z" fill="#D9487A" opacity=".3"/>
        <rect x="40" y="45" width="17" height="5" fill="#FFC93C"/>
        <rect x="40" y="150" width="17" height="5" fill="#E9AE1C"/>
        <rect x="55.5" y="30" width="2" height="140" fill="#2A2342" opacity=".12"/>
      </g>

      <!-- Face -->
      <g class="page__face">
        <g fill="#FF8FA3"><ellipse cx="71.5" cy="111" rx="7.4" ry="4.6" opacity=".38"/><ellipse cx="72.3" cy="110.6" rx="4.8" ry="3" opacity=".4"/><ellipse cx="128.5" cy="111" rx="7.4" ry="4.6" opacity=".38"/><ellipse cx="127.7" cy="110.6" rx="4.8" ry="3" opacity=".4"/></g>

        <g class="page__eyes-open">
          <g class="page__eyes-look">
            <ellipse cx="85" cy="95" rx="8.3" ry="10" fill="#2A2342"/>
            <ellipse cx="115" cy="95" rx="8.3" ry="10" fill="#2A2342"/>
            <circle cx="88" cy="91" r="3.1" fill="#fff"/>
            <circle cx="118" cy="91" r="3.1" fill="#fff"/>
            <circle cx="82.6" cy="99" r="1.4" fill="#fff"/>
            <circle cx="112.6" cy="99" r="1.4" fill="#fff"/>
          </g>
        </g>

        <g class="page__lids" fill="#B8325F">
          <path d="M76.4 95.6 A8.6 10.4 0 0 1 93.6 95.6 Q85 99.6 76.4 95.6 Z"/>
          <path d="M106.4 95.6 A8.6 10.4 0 0 1 123.6 95.6 Q115 99.6 106.4 95.6 Z"/>
        </g>

        <g class="page__eyes-closed" fill="none" stroke="#2A2342" stroke-width="3.4" stroke-linecap="round">
          <path class="page__arc-happy" d="M77 98.5 Q85 88 93 98.5 M107 98.5 Q115 88 123 98.5"/>
          <path class="page__arc-sleep" d="M77 95 Q85 102.5 93 95 M107 95 Q115 102.5 123 95"/>
        </g>

        <path class="page__mouth-smile" d="M92 111 Q100 119.5 108 111" fill="none" stroke="#2A2342" stroke-width="3" stroke-linecap="round"/>
        <g class="page__mouth-open">
          <path d="M91.5 109.5 Q100 111 108.5 109.5 Q107.5 123 100 123 Q92.5 123 91.5 109.5 Z" fill="#2A2342"/>
          <path d="M95 119.6 Q100 115.4 105 119.6 Q102.8 122.8 100 122.8 Q97.2 122.8 95 119.6 Z" fill="#FF8FA3"/>
        </g>

        <g class="page__glasses">
          <g fill="none" stroke="#2A2342" stroke-width="2.4" stroke-linecap="round">
            <circle cx="85" cy="95" r="12.8" fill="#fff" fill-opacity=".2"/>
            <circle cx="115" cy="95" r="12.8" fill="#fff" fill-opacity=".2"/>
            <path d="M97.8 93.6 Q100 91 102.2 93.6 M72.2 93 L64 89.5 M127.8 93 L136 89.5"/>
          </g>
          <path d="M77.6 89.5 Q79.8 86.3 83.4 85.8 M107.6 89.5 Q109.8 86.3 113.4 85.8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
        </g>
      </g>
    </g>

    <!-- Sleeping Z's -->
    <g class="page__zzz" fill="none" stroke="#2A2342" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(142 30)"><path class="page__z page__z--1" d="M0 0 H8 L0 9 H8"/></g>
      <g transform="translate(155 15)"><path class="page__z page__z--2" d="M0 0 H10 L0 11 H10"/></g>
      <g transform="translate(170 0)"><path class="page__z page__z--3" d="M0 0 H12 L0 13 H12"/></g>
    </g>

    <!-- Loose pages that fly out on celebrations -->
    <g class="page__flutter">
      <g transform="translate(94 34)"><g class="page__leaf page__leaf--1"><rect x="-6" y="-7.5" width="12" height="15" rx="1.5" fill="#FFF6E3"/><path d="M-3 -3 H3 M-3 0.5 H3 M-3 4 H1" stroke="#EADBC0" stroke-width="1.3" stroke-linecap="round"/></g></g>
      <g transform="translate(106 34)"><g class="page__leaf page__leaf--2"><rect x="-6" y="-7.5" width="12" height="15" rx="1.5" fill="#FFF6E3"/><path d="M-3 -3 H3 M-3 0.5 H3 M-3 4 H1" stroke="#EADBC0" stroke-width="1.3" stroke-linecap="round"/></g></g>
      <g transform="translate(100 36)"><g class="page__leaf page__leaf--3"><rect x="-5" y="-6.5" width="10" height="13" rx="1.5" fill="#FFF6E3"/><path d="M-2.5 -2.5 H2.5 M-2.5 1 H2.5" stroke="#EADBC0" stroke-width="1.2" stroke-linecap="round"/></g></g>
    </g>

    <!-- Celebration sparkles -->
    <g class="page__sparkles">
      <g transform="translate(28 54)"><path class="page__spark page__spark--1" d="M0 -8 Q1.4 -1.4 8 0 Q1.4 1.4 0 8 Q-1.4 1.4 -8 0 Q-1.4 -1.4 0 -8 Z" fill="#FFC93C"/></g>
      <g transform="translate(174 50)"><path class="page__spark page__spark--2" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#2FB5A5"/></g>
      <g transform="translate(16 104)"><path class="page__spark page__spark--3" d="M0 -6 Q1 -1 6 0 Q1 1 0 6 Q-1 1 -6 0 Q-1 -1 0 -6 Z" fill="#2FB5A5"/></g>
      <g transform="translate(186 100)"><path class="page__spark page__spark--4" d="M0 -8 Q1.4 -1.4 8 0 Q1.4 1.4 0 8 Q-1.4 1.4 -8 0 Q-1.4 -1.4 0 -8 Z" fill="#FFC93C"/></g>
      <g transform="translate(66 14)"><path class="page__spark page__spark--5" d="M0 -6 Q1 -1 6 0 Q1 1 0 6 Q-1 1 -6 0 Q-1 -1 0 -6 Z" fill="#FFC93C"/></g>
      <g transform="translate(150 160)"><path class="page__spark page__spark--6" d="M0 -5 Q0.9 -0.9 5 0 Q0.9 0.9 0 5 Q-0.9 0.9 -5 0 Q-0.9 -0.9 0 -5 Z" fill="#FFC93C"/></g>
    </g>

    <!-- Break buddy -->
    <g class="page__butterfly">
      <g transform="translate(166 54) scale(1.4)">
        <g class="page__bfly">
          <g class="page__bfly-wings">
            <ellipse cx="-4.6" cy="-2.4" rx="5" ry="4.2" fill="#2FB5A5"/>
            <ellipse cx="4.6" cy="-2.4" rx="5" ry="4.2" fill="#2FB5A5"/>
            <ellipse cx="-3.6" cy="3" rx="3.4" ry="3" fill="#FFC93C"/>
            <ellipse cx="3.6" cy="3" rx="3.4" ry="3" fill="#FFC93C"/>
          </g>
          <rect x="-1.1" y="-5" width="2.2" height="10" rx="1.1" fill="#2A2342"/>
          <path d="M-0.5 -5 Q-2 -8.5 -3.6 -9 M0.5 -5 Q2 -8.5 3.6 -9" fill="none" stroke="#2A2342" stroke-width="0.9" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
