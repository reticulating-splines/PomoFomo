<svg class="char otho" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!--
    Otho Sackville-Baggins — hidden easter-egg buddy. Ink-and-wash, after the
    parent's drawing: curly hair, heavy brows, side-eye, big nose, goatee,
    pointed collar, grey waistcoat. He covets spoons.
    Pivots live in otho.css in viewBox coordinates (transform-box: view-box).
  -->
  <defs>
    <g id="otho-spoon">
      <path d="M-1.7 1 L1.7 1 L2.4 21 L-2.4 21 Z" fill="#D9DFE8" stroke="#231F2A" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="0" cy="1" r="2.8" fill="#D9DFE8" stroke="#231F2A" stroke-width="1.4"/>
      <ellipse cx="0" cy="29" rx="6" ry="8.6" fill="#D9DFE8" stroke="#231F2A" stroke-width="1.5"/>
      <ellipse cx="1.4" cy="31" rx="3.2" ry="5" fill="#B7C1CF" opacity=".7"/>
      <ellipse cx="-1.9" cy="26" rx="1.3" ry="3.2" fill="#fff"/>
    </g>
  </defs>

  <ellipse class="otho__shadow" cx="100" cy="180" rx="42" ry="5.5" fill="rgba(42,35,66,0.10)"/>

  <g class="otho__root">
    <g class="otho__inner">

      <!-- Big hairy hobbit feet -->
      <g class="otho__feet">
        <ellipse cx="83" cy="175" rx="14" ry="5.8" fill="#F2DECB" stroke="#231F2A" stroke-width="2.2"/>
        <ellipse cx="117" cy="175" rx="14" ry="5.8" fill="#F2DECB" stroke="#231F2A" stroke-width="2.2"/>
        <path d="M74 172c1-3 3-2 4-5m3 5c1-3 3-3 3-6m4 6c1-2 2-3 2-5M112 172c1-3 2-3 2-6m4 6c1-3 3-3 3-5m4 5c1-2 2-3 3-5" fill="none" stroke="#3A3540" stroke-width="1.7" stroke-linecap="round"/>
      </g>

      <!-- Shirt + waistcoat + breeches -->
      <g class="otho__body">
        <path d="M72 120C70 140 70 156 74 164L126 164C130 156 130 140 128 120C118 114 82 114 72 120Z" fill="#FAF8F4" stroke="#231F2A" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M74 122C82 120 90 122 94 124L100 146L106 124C110 122 118 120 126 122C129 138 129 154 126 164L74 164C71 154 71 138 74 122Z" fill="#A9A4B0" stroke="#231F2A" stroke-width="2.6" stroke-linejoin="round"/>
        <ellipse cx="84" cy="150" rx="8" ry="11" fill="#86818F" opacity=".45"/>
        <ellipse cx="117" cy="138" rx="6" ry="9" fill="#fff" opacity=".22"/>
        <path d="M78 130c2 8 2 18 1 28M122 128c-1 6-1 14 0 20" fill="none" stroke="#7F7A88" stroke-width="1.2" opacity=".6" stroke-linecap="round"/>
        <path d="M100 146V163" stroke="#231F2A" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="103.5" cy="151" r="1.9" fill="#231F2A"/>
        <circle cx="103.5" cy="158.5" r="1.9" fill="#231F2A"/>
        <path d="M76 162L124 162C126 168 124 172 120 172L104 172L100 167L96 172L80 172C76 172 74 168 76 162Z" fill="#5E5966" stroke="#231F2A" stroke-width="2.4" stroke-linejoin="round"/>
        <!-- big pointed collar -->
        <path d="M100 113L79 115L88.5 134Z" fill="#FAF8F4" stroke="#231F2A" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M100 113L121 115L111.5 134Z" fill="#FAF8F4" stroke="#231F2A" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M86 118l3 9M114 118l-3 9" stroke="#C9C5CE" stroke-width="1.2" stroke-linecap="round"/>
      </g>

      <!-- Arms crossed (idle, break-done), with a hoarded spoon peeking out -->
      <g class="otho__arms-crossed">
        <use href="#otho-spoon" transform="translate(86 141) rotate(52) scale(.85)"/>
        <path d="M70 128C64 140 70 153 84 152L116 152C130 153 136 140 130 128C122 136 110 139 100 139C90 139 78 136 70 128Z" fill="#FAF8F4" stroke="#231F2A" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M88 139C96 143 104 147 110 152" fill="none" stroke="#231F2A" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M74 137c2 6 6 10 12 11M126 137c-2 6-5 9-10 10" fill="none" stroke="#C9C5CE" stroke-width="1.3" stroke-linecap="round"/>
        <ellipse cx="121" cy="143.5" rx="5.2" ry="4.3" fill="#F2DECB" stroke="#231F2A" stroke-width="1.8"/>
      </g>

      <!-- Head -->
      <g class="otho__head">
        <!-- curly hair, back mass -->
        <path class="otho__hair" d="M60 96C52 90 52 78 56 70C50 60 54 46 64 42C64 30 76 24 86 28C92 20 106 20 112 27C122 22 134 30 136 40C146 44 150 58 144 68C150 78 148 90 140 96C134 100 128 96 128 90L72 90C72 96 66 100 60 96Z" fill="#3D3843" stroke="#231F2A" stroke-width="2.6" stroke-linejoin="round"/>
        <ellipse cx="78" cy="40" rx="14" ry="8" fill="#6E6977" opacity=".45"/>
        <ellipse cx="128" cy="52" rx="9" ry="12" fill="#6E6977" opacity=".35"/>
        <!-- pointy hobbit ears -->
        <path d="M70 72C64 71 58 67 54.5 62C55.5 71 61 79 70 82Z" fill="#F2DECB" stroke="#231F2A" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M130 72C136 71 142 67 145.5 62C144.5 71 139 79 130 82Z" fill="#F2DECB" stroke="#231F2A" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M66 75c-3-1-5-3-7-6M134 75c3-1 5-3 7-6" fill="none" stroke="#D9BBA0" stroke-width="1.5" stroke-linecap="round"/>
        <!-- face -->
        <path d="M68 68C66 92 78 114 100 117C122 114 134 92 132 68C130 52 118 44 100 44C82 44 70 52 68 68Z" fill="#F4E2D0" stroke="#231F2A" stroke-width="2.6"/>
        <path d="M71 80c2 14 10 26 22 32" fill="none" stroke="#E5CBB3" stroke-width="6" stroke-linecap="round" opacity=".7"/>
        <ellipse cx="86" cy="75" rx="9.5" ry="6.5" fill="#5A5266" opacity=".16"/>
        <ellipse cx="114" cy="75" rx="9.5" ry="6.5" fill="#5A5266" opacity=".16"/>
        <ellipse cx="80" cy="90" rx="6" ry="3.6" fill="#E89A8E" opacity=".22"/>
        <ellipse cx="120" cy="90" rx="6" ry="3.6" fill="#E89A8E" opacity=".22"/>
        <!-- fringe -->
        <path class="otho__hair" d="M66 64C64 52 72 42 84 42C90 36 102 36 108 41C118 38 130 44 133 56C135 62 132 66 128 64C126 58 120 54 114 56C110 50 102 50 98 55C92 50 84 52 82 58C78 54 70 58 70 64Z" fill="#3D3843" stroke="#231F2A" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M62 52c4-9 14-9 12-2s-10 4-6-4c3-6 12-7 14-1M84 34c4-7 13-6 11 0s-9 3-5-4c3-5 11-6 14 0M108 30c5-5 13-2 10 3s-9 1-4-5c4-4 11-3 13 2M126 40c5-3 11 2 7 6s-8-1-3-5c4-2 9 1 10 6M58 68c1-6 8-7 8-2s-6 4-5-2M136 62c4-4 10 0 7 4s-7 0-3-4c3-2 7 1 7 5M60 84c2-5 8-4 6 0s-6 2-3-3M134 86c4-4 9-1 6 3s-6 0-2-3M78 50c4-6 12-4 9 1s-8 1-4-4M98 46c4-5 11-3 8 2s-7 0-3-4M116 48c4-4 10-1 7 3s-7 0-3-3" fill="none" stroke="#1E1A22" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>

        <!-- brows -->
        <path class="otho__brow-l" d="M76 62C82 59.5 90 61.5 95 67" fill="none" stroke="#231F2A" stroke-width="4.6" stroke-linecap="round"/>
        <path class="otho__brow-r" d="M105 67C110 61.5 118 59.5 124 62" fill="none" stroke="#231F2A" stroke-width="4.6" stroke-linecap="round"/>

        <!-- eyes -->
        <g class="otho__eyes-open">
          <ellipse cx="86" cy="72" rx="6.6" ry="5" fill="#FFFDF8" stroke="#231F2A" stroke-width="1.7"/>
          <ellipse cx="114" cy="72" rx="6.6" ry="5" fill="#FFFDF8" stroke="#231F2A" stroke-width="1.7"/>
          <g class="otho__pupils">
            <circle cx="86" cy="72.6" r="2.6" fill="#231F2A"/>
            <circle cx="114" cy="72.6" r="2.6" fill="#231F2A"/>
            <circle cx="86.9" cy="71.6" r=".8" fill="#fff"/>
            <circle cx="114.9" cy="71.6" r=".8" fill="#fff"/>
          </g>
          <path class="otho__lid otho__lid--l" d="M78.8 72.4C78.8 65.4 93.2 65.4 93.2 72.4Z" fill="#F4E2D0" stroke="#231F2A" stroke-width="1.7" vector-effect="non-scaling-stroke"/>
          <path class="otho__lid otho__lid--r" d="M106.8 72.4C106.8 65.4 121.2 65.4 121.2 72.4Z" fill="#F4E2D0" stroke="#231F2A" stroke-width="1.7" vector-effect="non-scaling-stroke"/>
        </g>
        <g class="otho__eyes-closed" fill="none" stroke="#231F2A" stroke-width="2.4" stroke-linecap="round">
          <path class="otho__arc-sleep" d="M80 72.5C83 76 89 76 92 72.5M108 72.5C111 76 117 76 120 72.5"/>
          <path class="otho__arc-smug" d="M80 74C83 70 89 70 92 74M108 74C111 70 117 70 120 74"/>
        </g>

        <!-- big nose -->
        <ellipse cx="101" cy="93" rx="6.5" ry="4" fill="#E2B9A4" opacity=".45"/>
        <path d="M99 70C98 78 95 86 94 92C93 98 100 99 106 96C108.5 94.5 107 91 103.5 91.5" fill="none" stroke="#231F2A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- jowls -->
        <path d="M75 92C76 98 79 103 83 106M125 92C124 98 121 103 117 106" fill="none" stroke="#231F2A" stroke-width="2" stroke-linecap="round"/>

        <!-- mouths -->
        <g class="otho__mouth-frown" fill="none" stroke="#231F2A" stroke-width="2.6" stroke-linecap="round">
          <path d="M89.5 106.5C95 102 105 102 110.5 106.5"/>
          <path d="M111 106.5c1.5 1 2.5 2.5 2.5 3.5" stroke-width="1.8"/>
        </g>
        <ellipse class="otho__mouth-open" cx="100" cy="105.5" rx="4.2" ry="3.8" fill="#4A2E35" stroke="#231F2A" stroke-width="2"/>
        <path class="otho__mouth-smug" d="M89.5 105.5C96 107 104 105 111 100.5M111 100.5l2 -1" fill="none" stroke="#231F2A" stroke-width="2.6" stroke-linecap="round"/>

        <!-- goatee -->
        <path d="M95.5 110C93 116 96 121.5 100 121.5C104 121.5 107 116 104.5 110C102 113 98 113 95.5 110Z" fill="#3D3843" stroke="#231F2A" stroke-width="1.8" stroke-linejoin="round"/>
      </g>

      <!-- Arms out (focus + breaks). Spoon in the right hand points down at rest. -->
      <g class="otho__arms-out">
        <g class="otho__arm-l">
          <path d="M80 120C68 118 60 128 60 140C60 148 64 152 68 152C74 152 78 146 79 138Z" fill="#FAF8F4" stroke="#231F2A" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M66 132c-1 6 0 11 3 14" fill="none" stroke="#C9C5CE" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="65" cy="154" r="5.2" fill="#F2DECB" stroke="#231F2A" stroke-width="1.9"/>
        </g>
        <g class="otho__arm-r">
          <path d="M120 120C132 118 140 128 140 140C140 148 136 152 132 152C126 152 122 146 121 138Z" fill="#FAF8F4" stroke="#231F2A" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M134 132c1 6 0 11-3 14" fill="none" stroke="#C9C5CE" stroke-width="1.3" stroke-linecap="round"/>
          <use href="#otho-spoon" transform="translate(135 152)"/>
          <circle cx="135" cy="154" r="5.2" fill="#F2DECB" stroke="#231F2A" stroke-width="1.9"/>
          <path class="otho__twinkle" d="M140 172C140.8 176.5 141.5 177.2 146 178C141.5 178.8 140.8 179.5 140 184C139.2 179.5 138.5 178.8 134 178C138.5 177.2 139.2 176.5 140 172Z" fill="#FFE7A0" stroke="#231F2A" stroke-width="1"/>
        </g>
      </g>
    </g>

    <!-- Spoons flying out on break-start -->
    <g class="otho__fly otho__fly--1"><use href="#otho-spoon" transform="translate(100 128) scale(.8)"/></g>
    <g class="otho__fly otho__fly--2"><use href="#otho-spoon" transform="translate(100 128) scale(.8)"/></g>
    <g class="otho__fly otho__fly--3"><use href="#otho-spoon" transform="translate(100 128) scale(.8)"/></g>

    <!-- A little orbit of spoons over his head during break-active -->
    <g class="otho__halo">
      <g class="otho__halo-spin">
        <use href="#otho-spoon" transform="translate(70 14) rotate(-90) scale(.7)"/>
        <use href="#otho-spoon" transform="translate(130 14) rotate(90) scale(.7)"/>
      </g>
    </g>

    <!-- Z's -->
    <g class="otho__zzz" fill="none" stroke="#231F2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path class="otho__z otho__z--1" d="M140 52h7l-7 8h7"/>
      <path class="otho__z otho__z--2" d="M150 40h6l-6 7h6"/>
      <path class="otho__z otho__z--3" d="M158 28h5l-5 6h5"/>
    </g>

    <!-- Harrumph -->
    <text class="otho__hmph" x="142" y="40" font-family="Fredoka, Nunito, sans-serif" font-weight="600" font-size="16" fill="#231F2A">hmph!</text>
  </g>
</svg>
