<svg class="char yumyumnia" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Yumyumnia the elf wizard — designed by a real 8-year-old.
       Bold wobbly outlines + flat colours, kept true to the original drawing. -->
  <ellipse class="yumyumnia__shadow" cx="100" cy="181" rx="46" ry="6" fill="rgba(42,35,66,0.12)"/>

  <g class="yumyumnia__root">
    <g class="yumyumnia__inner">

      <!-- Hair (behind everything on the head) -->
      <g class="yumyumnia__hair">
        <path d="M63 72C57 44 76 25 100 25c26 0 44 18 39 47 2 14 4 28 9 41l-6-4-2 9-5-9-3 8-4-11-3 7-2-13c-2-10 2-18-1-26H74c-3 8 1 16-1 26l-2 13-3-7-4 11-3-8-5 9-2-9-6 4c5-13 7-27 9-41z"
              fill="#16131F" stroke="#16131F" stroke-width="3" stroke-linejoin="round"/>
        <path d="M70 60c-4 14-2 30-5 44M131 58c4 14 3 30 7 46M78 38c-6 8-8 16-8 22M123 36c7 8 9 15 9 23"
              fill="none" stroke="#6E6880" stroke-width="1" stroke-linecap="round" opacity=".7"/>
      </g>

      <!-- Left arm: drooping sleeve, arm, hand, red flame -->
      <g class="yumyumnia__arm-l">
        <path class="yumyumnia__sleeve" d="M80 120 50 97c-6 9-6 21 2 30 8 8 20 9 30 3z" fill="#FF55DC" stroke="#16131F" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M81 124 48 97" stroke="#16131F" stroke-width="17" stroke-linecap="round"/>
        <path d="M81 124 48 97" stroke="#FF55DC" stroke-width="11" stroke-linecap="round"/>
        <ellipse cx="45" cy="93" rx="8" ry="6.5" transform="rotate(-25 45 93)" fill="#EC8E4C" stroke="#16131F" stroke-width="3"/>
        <g class="yumyumnia__flame yumyumnia__flame-l">
          <path class="yumyumnia__flame-outer" d="M44 89c-10 0-15-8-12-17 2-5 6-8 5-15 5 4 6 8 6 11 2-7 6-11 10-14-1 6 1 10 3 15 4 9-2 20-12 20z" fill="#FF3B1F" stroke="#16131F" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M44 86c-5 0-8-4-6-9 1-3 3-5 3-9 3 2 4 5 4 7 1-3 3-5 5-6 0 4 1 6 2 9 1 5-3 8-8 8z" fill="#FF9A1F"/>
          <path d="M44 85c-2 0-4-2-3-4l3-6 3 6c1 2-1 4-3 4z" fill="#FFE14A"/>
        </g>
      </g>

      <!-- Right arm: drooping sleeve, arm, hand, icy blue flame -->
      <g class="yumyumnia__arm-r">
        <path class="yumyumnia__sleeve" d="M120 120l30-23c6 9 6 21-2 30-8 8-20 9-30 3z" fill="#FF55DC" stroke="#16131F" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M119 124 152 97" stroke="#16131F" stroke-width="17" stroke-linecap="round"/>
        <path d="M119 124 152 97" stroke="#FF55DC" stroke-width="11" stroke-linecap="round"/>
        <ellipse cx="155" cy="93" rx="8" ry="6.5" transform="rotate(25 155 93)" fill="#EC8E4C" stroke="#16131F" stroke-width="3"/>
        <g class="yumyumnia__flame yumyumnia__flame-r">
          <path class="yumyumnia__flame-outer" d="M156 89c-10 0-15-8-12-16 2-6 5-8 5-14 4 3 5 7 5 10 2-6 5-10 9-13-1 6 2 10 4 15 3 9-2 18-11 18z" fill="#A9E6F2" stroke="#16131F" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M156 86c-5 0-8-4-6-8 1-3 3-5 3-9 3 2 4 5 4 7 1-3 3-5 5-6 0 4 1 6 2 9 1 5-3 7-8 7z" fill="#E4F9FD"/>
          <ellipse cx="156" cy="81" rx="3" ry="4" fill="#fff"/>
        </g>
      </g>

      <!-- Robe -->
      <g class="yumyumnia__robe">
        <path d="M79 111c-9 19-15 40-20 65h82c-5-25-11-46-20-65-12 6-30 6-42 0z" fill="#FF55DC" stroke="#16131F" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M85 128c-4 14-6 30-7 46M118 130c3 14 5 28 6 44" fill="none" stroke="#E03FBF" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
        <path d="M66 165c22 4 46 4 68 0" fill="none" stroke="#FFC93C" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
        <!-- Neck + collar -->
        <path d="M91 100h18l3 13c-8 4-16 4-24 0z" fill="#EC8E4C"/>
        <path d="M80 111c13 7 27 7 40 0" fill="none" stroke="#16131F" stroke-width="3.2" stroke-linecap="round"/>
      </g>

      <!-- Head -->
      <g class="yumyumnia__head">
        <g class="yumyumnia__ears">
          <path d="M69 74 51 53c2 11 7 23 17 31z" fill="#EC8E4C" stroke="#16131F" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M131 74l18-21c-2 11-7 23-17 31z" fill="#EC8E4C" stroke="#16131F" stroke-width="2.8" stroke-linejoin="round"/>
        </g>
        <circle class="yumyumnia__face" cx="100" cy="70" r="33" fill="#EC8E4C" stroke="#16131F" stroke-width="3"/>
        <path d="M70 55c5-14 18-21 31-21s25 6 30 20c-7-6-12-7-17-5-4-5-11-6-15-1-6-5-15-3-21 4-3-1-6 0-8 3z"
              fill="#16131F" stroke="#16131F" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- Scribbly magic glow around each eye -->
        <g class="yumyumnia__glow">
          <circle cx="85" cy="68" r="12" fill="#FFC93C" opacity=".45"/>
          <path d="M74 64l3 3 2-4 3 3 2-4 3 4 2-3 3 3 2-3 3 4M75 73l3-2 2 4 3-3 2 4 3-3 2 3 3-3 3 3" fill="none" stroke="#FFA21F" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="115" cy="68" r="12" fill="#D9573A" opacity=".35"/>
          <path d="M104 63l3 4 2-4 3 3 2-4 3 4 2-3 3 3 2-3 2 4M105 73l3-3 2 4 3-3 2 4 3-3 2 3 3-3 2 3" fill="none" stroke="#E2241B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g class="yumyumnia__eyes-open">
          <g class="yumyumnia__gaze">
            <path d="M76 68c5-7 13-7 18 0-5 7-13 7-18 0z" fill="#FFE11A" stroke="#16131F" stroke-width="2" stroke-linejoin="round"/>
            <ellipse cx="85" cy="68" rx="1.4" ry="5" fill="#16131F"/>
            <circle cx="88" cy="66" r="1.3" fill="#fff"/>
            <path d="M106 68c5-7 13-7 18 0-5 7-13 7-18 0z" fill="#FF2A1A" stroke="#16131F" stroke-width="2" stroke-linejoin="round"/>
            <ellipse cx="115" cy="68" rx="1.4" ry="5" fill="#16131F"/>
            <circle cx="118" cy="66" r="1.3" fill="#fff"/>
          </g>
        </g>
        <g class="yumyumnia__lids">
          <path d="M75 69c5-9 14-9 20 0z" fill="#EC8E4C"/>
          <path d="M105 69c5-9 14-9 20 0z" fill="#EC8E4C"/>
          <path d="M76 69h18M106 69h18" stroke="#16131F" stroke-width="2.4" stroke-linecap="round"/>
        </g>
        <g class="yumyumnia__eyes-closed" fill="none" stroke="#16131F" stroke-width="2.6" stroke-linecap="round">
          <path class="yumyumnia__arc-happy" d="M78 71c4-7 10-7 14 0M108 71c4-7 10-7 14 0"/>
          <path class="yumyumnia__arc-sleep" d="M78 67c4 6 10 6 14 0M108 67c4 6 10 6 14 0"/>
        </g>

        <path class="yumyumnia__mouth-smile" d="M83 84c8 12 26 12 34 0" fill="none" stroke="#16131F" stroke-width="2.8" stroke-linecap="round"/>
        <path class="yumyumnia__mouth-open" d="M86 84c6 14 22 14 28 0z" fill="#7A2236" stroke="#16131F" stroke-width="2.6" stroke-linejoin="round"/>
      </g>

      <!-- Floating spellbook (focus) -->
      <g class="yumyumnia__book">
        <path d="M80 140l20 4 20-4v-18l-20 4-20-4z" fill="#6C4BD6" stroke="#16131F" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M83 137l17 3v-14l-17-3zM117 137l-17 3v-14l17-3z" fill="#FFF6E3" stroke="#16131F" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M86 128l10 2M86 132l10 2M104 130l10-2M104 134l10-2" stroke="#B9AED8" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M100 113l1.4 3 3 1.4-3 1.4-1.4 3-1.4-3-3-1.4 3-1.4z" fill="#FFC93C"/>
      </g>
    </g>

    <!-- Smoke wisps where the flames were (sleeping) -->
    <g class="yumyumnia__smoke" fill="none" stroke="#9C97AE" stroke-width="2.4" stroke-linecap="round">
      <path class="yumyumnia__wisp yumyumnia__wisp--l" d="M44 86c-4-4 4-7 0-11s4-7 0-11"/>
      <path class="yumyumnia__wisp yumyumnia__wisp--r" d="M156 86c-4-4 4-7 0-11s4-7 0-11"/>
    </g>

    <!-- Fireball she juggles on breaks -->
    <g class="yumyumnia__fireball">
      <circle cx="100" cy="40" r="8" fill="#FF6A1F" stroke="#16131F" stroke-width="2.2"/>
      <circle cx="98" cy="38" r="4" fill="#FFD23F"/>
      <circle cx="96.5" cy="36.5" r="1.4" fill="#fff"/>
    </g>

    <g class="yumyumnia__zzz" fill="#6C6FF5" font-family="Fredoka, Nunito, sans-serif" font-weight="700">
      <text class="yumyumnia__z yumyumnia__z--1" x="138" y="40" font-size="12">z</text>
      <text class="yumyumnia__z yumyumnia__z--2" x="148" y="28" font-size="15">z</text>
      <text class="yumyumnia__z yumyumnia__z--3" x="160" y="14" font-size="18">Z</text>
    </g>

    <g class="yumyumnia__sparks">
      <path class="yumyumnia__spark yumyumnia__spark--1" d="M30 50l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#FFC93C"/>
      <path class="yumyumnia__spark yumyumnia__spark--2" d="M60 30l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#FF6A1F"/>
      <path class="yumyumnia__spark yumyumnia__spark--3" d="M170 52l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#A9E6F2"/>
      <path class="yumyumnia__spark yumyumnia__spark--4" d="M140 28l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#FF55DC"/>
      <path class="yumyumnia__spark yumyumnia__spark--5" d="M22 92l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#FF3B1F"/>
      <path class="yumyumnia__spark yumyumnia__spark--6" d="M178 92l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#E4F9FD"/>
    </g>
  </g>
</svg>
