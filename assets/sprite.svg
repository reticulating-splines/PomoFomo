    <rect x="5" y="13" width="14" height="7" rx="1" fill="#F3E1C7"/>
    <rect x="6" y="5.5" width="2.2" height="5.5" rx=".5" fill="#E5507A"/>
    <rect x="8.6" y="6.5" width="2" height="4.5" rx=".5" fill="#6C6FF5"/>
