<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    PomoFomo icon sprite. Use as <svg class="icon"><use href="…/sprite.svg#id"/></svg>.
    UI icons (24×24) draw in currentColor. Reward + break-idea icons are
    full-colour illustrations (gem/star 24×24, ideas 64×64).
  -->

  <!-- ── UI ─────────────────────────────────────────────────────────────── -->
  <symbol id="play" viewBox="0 0 24 24">
    <path d="M8 5.6c0-1.1 1.2-1.8 2.2-1.2l9.1 5.6c.9.6.9 1.9 0 2.5l-9.1 5.6c-1 .6-2.2-.1-2.2-1.2z" fill="currentColor"/>
  </symbol>
  <symbol id="pause" viewBox="0 0 24 24">
    <rect x="6" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/>
    <rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/>
  </symbol>
  <symbol id="skip" viewBox="0 0 24 24">
    <path d="M5 6.3c0-1 1.1-1.6 1.9-1l7.4 5.3c.7.5.7 1.5 0 2l-7.4 5.3c-.8.6-1.9 0-1.9-1z" fill="currentColor"/>
    <rect x="16" y="5" width="3.2" height="14" rx="1.4" fill="currentColor"/>
  </symbol>
  <symbol id="stop" viewBox="0 0 24 24">
    <rect x="6" y="6" width="12" height="12" rx="3" fill="currentColor"/>
  </symbol>
  <symbol id="sliders" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M4 7h9M18 7h2M4 17h3M12 17h8"/>
      <circle cx="15.5" cy="7" r="2.4"/>
      <circle cx="9.5" cy="17" r="2.4"/>
    </g>
  </symbol>
  <symbol id="back" viewBox="0 0 24 24">
    <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="open" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 5h6v6M19 5l-8 8"/>
      <path d="M17 14v3a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3"/>
    </g>
  </symbol>
  <symbol id="shuffle" viewBox="0 0 24 24">
