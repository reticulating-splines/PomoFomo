<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PomoFomo</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../characters/ember.css">
  <link rel="stylesheet" href="../characters/page.css">
  <link rel="stylesheet" href="../characters/yumyumnia.css">
  <link rel="stylesheet" href="../characters/otho.css">
  <link rel="stylesheet" href="popup.css">
</head>

<!-- data-view="status" | "settings"; data-status/data-paused tint the card -->
<body data-view="status" data-status="idle" data-paused="false" data-loading>

  <header class="bar">
    <img class="bar__mark" src="../assets/icons/icon.svg" alt="" width="26" height="26">
    <span class="bar__title" id="barTitle">PomoFomo</span>
    <!-- Keeps the timer visible while in settings -->
    <span class="bar__mini" id="mini" aria-hidden="true"></span>
    <button class="bar__btn" id="btnView" aria-label="Settings" aria-controls="viewSettings" aria-expanded="false">
      <svg class="icon icon--settings" aria-hidden="true"><use href="../assets/sprite.svg#sliders"/></svg>
      <svg class="icon icon--back" aria-hidden="true"><use href="../assets/sprite.svg#back"/></svg>
    </button>
  </header>

  <div class="views">

    <!-- ── Status ────────────────────────────────────────────────────────── -->
    <section class="view view--status" id="viewStatus" aria-label="Timer status">

      <div class="now">
        <div class="now__top">
          <div class="now__face" id="nowFace" aria-hidden="true"></div>
          <div class="now__text">
            <div class="now__phase" id="phase">Ready to start</div>
            <div class="now__time" id="time" role="timer">20:00</div>
          </div>
        </div>

        <div class="now__bar" aria-hidden="true"><span id="bar"></span></div>
        <div class="now__meta">
          <span id="rounds">Round 1 of 3</span>
          <span id="ends"></span>
        </div>

        <button class="btn btn--primary now__start" id="btnStart" hidden>
          <svg class="icon" aria-hidden="true"><use href="../assets/sprite.svg#play"/></svg>
          Start focus
        </button>

        <!-- Quiet grown-up controls -->
        <div class="controls" id="controls" hidden>
          <button class="ctl" id="btnPause">
            <svg class="icon" aria-hidden="true"><use id="pauseIcon" href="../assets/sprite.svg#pause"/></svg>
            <span id="pauseLabel">Pause</span>
          </button>
          <button class="ctl" id="btnSkip">
            <svg class="icon" aria-hidden="true"><use href="../assets/sprite.svg#skip"/></svg>
            <span id="skipLabel">Skip</span>
          </button>
          <button class="ctl" id="btnStop">
            <svg class="icon" aria-hidden="true"><use href="../assets/sprite.svg#stop"/></svg>
            Stop
          </button>
        </div>
      </div>

      <button class="open-btn" id="btnOpen">
        Open the timer tab
        <svg class="icon" aria-hidden="true"><use href="../assets/sprite.svg#open"/></svg>
      </button>

      <div class="week">
        <div class="week__head">
          <h2 class="week__title">This week</h2>
          <span class="week__legend"><i></i> focus rounds</span>
        </div>
        <div class="week__bars" id="weekBars" role="img"></div>
        <dl class="week__stats">
          <div><dt>Rounds</dt><dd id="statRounds">0</dd></div>
          <div><dt>Focus time</dt><dd id="statMinutes">0 min</dd></div>
          <div>
            <dt id="statRewardLabel">Full breaks</dt>
            <dd><svg class="icon" aria-hidden="true"><use id="statRewardIcon" href="../assets/sprite.svg#book"/></svg> <span id="statBreaks">0</span></dd>
          </div>
        </dl>
        <p class="week__shelf" id="weekShelf"></p>
      </div>
    </section>

    <!-- ── Settings ──────────────────────────────────────────────────────── -->
    <section class="view view--settings" id="viewSettings" aria-label="Settings">

      <h2 class="group__title">Timer</h2>
      <div class="group">
        <div class="stepper" data-key="focusMinutes" data-min="5" data-max="60" data-step="5" data-unit="min">
          <span class="stepper__label" id="lblFocus">Focus</span>
          <div class="stepper__ctl" role="group" aria-labelledby="lblFocus">
            <button type="button" class="stepper__btn" data-dir="-1" aria-label="Less focus time"><svg class="icon"><use href="../assets/sprite.svg#minus"/></svg></button>
            <output class="stepper__val" aria-live="polite"></output>
            <button type="button" class="stepper__btn" data-dir="1" aria-label="More focus time"><svg class="icon"><use href="../assets/sprite.svg#plus"/></svg></button>
          </div>
        </div>
        <div class="stepper" data-key="shortBreakMinutes" data-min="1" data-max="15" data-step="1" data-unit="min">
          <span class="stepper__label" id="lblShort">Short break</span>
          <div class="stepper__ctl" role="group" aria-labelledby="lblShort">
            <button type="button" class="stepper__btn" data-dir="-1" aria-label="Shorter break"><svg class="icon"><use href="../assets/sprite.svg#minus"/></svg></button>
            <output class="stepper__val" aria-live="polite"></output>
            <button type="button" class="stepper__btn" data-dir="1" aria-label="Longer break"><svg class="icon"><use href="../assets/sprite.svg#plus"/></svg></button>
          </div>
        </div>
        <div class="stepper" data-key="longBreakMinutes" data-min="5" data-max="30" data-step="5" data-unit="min">
          <span class="stepper__label" id="lblLong">Big break</span>
          <div class="stepper__ctl" role="group" aria-labelledby="lblLong">
            <button type="button" class="stepper__btn" data-dir="-1" aria-label="Shorter big break"><svg class="icon"><use href="../assets/sprite.svg#minus"/></svg></button>
            <output class="stepper__val" aria-live="polite"></output>
            <button type="button" class="stepper__btn" data-dir="1" aria-label="Longer big break"><svg class="icon"><use href="../assets/sprite.svg#plus"/></svg></button>
          </div>
        </div>
        <div class="stepper" data-key="sessionsBeforeLongBreak" data-min="2" data-max="6" data-step="1" data-unit="rounds">
          <span class="stepper__label" id="lblRounds">Big break after</span>
          <div class="stepper__ctl" role="group" aria-labelledby="lblRounds">
            <button type="button" class="stepper__btn" data-dir="-1" aria-label="Fewer rounds"><svg class="icon"><use href="../assets/sprite.svg#minus"/></svg></button>
            <output class="stepper__val" aria-live="polite"></output>
            <button type="button" class="stepper__btn" data-dir="1" aria-label="More rounds"><svg class="icon"><use href="../assets/sprite.svg#plus"/></svg></button>
          </div>
        </div>
        <p class="group__hint" id="cycleHint"></p>
      </div>

      <h2 class="group__title">Timer buddy</h2>
      <div class="buddies" role="radiogroup" aria-label="Timer buddy">
        <label class="buddy">
          <input type="radio" name="timerCharacter" value="dragon">
          <span class="buddy__art" data-char="dragon" aria-hidden="true"></span>
          <span class="buddy__name">Ember</span>
          <span class="buddy__kind">the dragon · books</span>
        </label>
        <label class="buddy">
          <input type="radio" name="timerCharacter" value="book">
          <span class="buddy__art" data-char="book" aria-hidden="true"></span>
          <span class="buddy__name">Page</span>
          <span class="buddy__kind">the book · books</span>
        </label>
        <label class="buddy">
          <input type="radio" name="timerCharacter" value="wizard">
          <span class="buddy__art" data-char="wizard" aria-hidden="true"></span>
          <span class="buddy__name">Yumyumnia</span>
          <span class="buddy__kind">elf wizard · fireballs</span>
          <span class="buddy__credit">Designed by a real 8-year-old</span>
        </label>
        <label class="buddy" id="buddyOtho" hidden>
          <input type="radio" name="timerCharacter" value="otho">
          <span class="buddy__art" data-char="otho" aria-hidden="true"></span>
          <span class="buddy__name">Otho</span>
          <span class="buddy__kind">Sackville-Baggins · spoons</span>
        </label>
      </div>

      <div class="group group--spaced">
        <label class="field">
          <span class="field__text">
            <span class="switch__label">Your kid’s name</span>
            <span class="switch__hint">Optional. The buddy uses it to say hi.</span>
          </span>
          <input class="field__input" id="kidName" type="text" maxlength="20" autocomplete="off" spellcheck="false" placeholder="e.g. Sam">
        </label>
      </div>

      <h2 class="group__title">Breaks</h2>
      <div class="group">
        <label class="switch">
          <span class="switch__text">
            <span class="switch__label">Sounds</span>
            <span class="switch__hint">Chimes, plus calm nature sounds during breaks.</span>
          </span>
          <input type="checkbox" role="switch" data-key="soundEnabled">
          <span class="switch__track" aria-hidden="true"></span>
        </label>
        <label class="switch">
          <span class="switch__text">
            <span class="switch__label">Keep bringing the timer back</span>
            <span class="switch__hint">During breaks, switch back to the timer tab every 30 seconds.</span>
          </span>
          <input type="checkbox" role="switch" data-key="nagDuringBreak">
          <span class="switch__track" aria-hidden="true"></span>
        </label>
        <label class="switch">
          <span class="switch__text">
            <span class="switch__label">Resume after Chrome restarts</span>
            <span class="switch__hint">Otherwise the timer resets when Chrome closes.</span>
          </span>
          <input type="checkbox" role="switch" data-key="persistOnRelaunch">
          <span class="switch__track" aria-hidden="true"></span>
        </label>
      </div>

      <p class="foot-note">Time changes start with the next round.</p>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
